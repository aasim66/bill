<script>
    let heldOrders = []; // store temporary held orders

    // === HOLD ORDER FUNCTION ===
    function holdCurrentOrder() {
        if (orderList.length === 0) {
            alert("No order to hold!");
            return;
        }

        const orderCopy = JSON.parse(JSON.stringify(orderList)); // deep copy
        const timestamp = new Date().toLocaleString();

        heldOrders.push({
            id: Date.now(),
            items: orderCopy,
            total: orderCopy.reduce((sum, item) => sum + item.price * item.quantity, 0),
            time: timestamp
        });

        renderHeldOrders();
        clearOrder();
        updateOrderCount();
        switchTab('hold');
    }

    // === RENDER HELD ORDERS ===
    function renderHeldOrders() {
        const holdGrid = document.getElementById('holdGrid');
        if (!holdGrid) return;
        holdGrid.innerHTML = '';

        if (heldOrders.length === 0) {
            holdGrid.innerHTML = '<p>No held orders.</p>';
            return;
        }

        heldOrders.forEach((order, index) => {
            const div = document.createElement('div');
            div.className = "col-12 card p-2 mb-2 shadow-sm";
            div.innerHTML = `
                <strong>Order ${index + 1}</strong> (${order.time})<br>
                <span>Total: ₹${order.total.toFixed(2)}</span><br>
                <small>Items: ${order.items.map(i => i.name + ' x' + i.quantity)  .join(", <br> ")}</small><br>
                <button class="btn btn-sm btn-primary mt-2" onclick="resumeHeldOrder(${index})">Resume</button>
                <button class="btn btn-sm btn-danger mt-2" onclick="deleteHeldOrder(${index})">Delete</button>
            `;
            holdGrid.appendChild(div);
        });
    }

    // === RESUME HELD ORDER ===
    function resumeHeldOrder(index) {
        orderList = [...heldOrders[index].items];
        renderOrder();
        updateOrderCount();
        heldOrders.splice(index, 1);
        renderHeldOrders();
        switchTab('order');
    }

    // === DELETE HELD ORDER ===
    function deleteHeldOrder(index) {
        if (confirm("Are you sure you want to delete this held order?")) {
            heldOrders.splice(index, 1);
            renderHeldOrders();
        }
    }
</script>

                        <td class="action-buttons">
                            <i class="far fa-edit" style="font-size:24px;" onclick="editOrder(${index})"></i>
                            <i class="material-icons" style="font-size:24px;" onclick="deleteOrder(${index})">&#xe872;</i>
                        </td>
                    </tr>
                `;
            });

            tableHTML += `
                    </tbody>
                </table>
            `;

            orderDiv.innerHTML = tableHTML;
            document.getElementById('total').innerText = 'Total: ₹' + total.toFixed(2);
        }

        function editOrder(index) {
            currentEditIndex = index;
            const item = orderList[index];
            document.getElementById('editProductName').value = item.name;
            document.getElementById('editProductQuantity').value = item.quantity;
            toggleEditPopup();
        }

        function saveEditOrder() {
            if (currentEditIndex !== null) {
                const quantity = parseInt(document.getElementById('editProductQuantity').value);
                if (quantity >= 1) {
                    orderList[currentEditIndex].quantity = quantity;
                    renderOrder();
                    updateOrderCount();
                    toggleEditPopup();
                } else {
                    alert('Quantity must be at least 1!');
                }
            }
        }

        function deleteOrder(index) {
            orderList.splice(index, 1);
            renderOrder();
            updateOrderCount();
        }

        function clearOrder() {
            orderList = [];
            renderOrder();
            updateOrderCount();
        }

        function switchTab(tabId) {
            const tabs = document.querySelectorAll('.tab-content');
            tabs.forEach(tab => tab.classList.remove('active'));
            const tabButtons = document.querySelectorAll('.tab');
            tabButtons.forEach(button => button.classList.remove('active'));
            const mobileNavItems = document.querySelectorAll('.mobile-nav-item');
            mobileNavItems.forEach(item => item.classList.remove('active'));
            const sidebarItems = document.querySelectorAll('.sidebar a');
            sidebarItems.forEach(item => item.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            document.querySelector(`.tab[data-tab="${tabId}"]`)?.classList.add('active');
            document.querySelector(`.mobile-nav-item[data-tab="${tabId}"]`)?.classList.add('active');
            document.querySelector(`.sidebar a[data-tab="${tabId}"]`)?.classList.add('active');
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            const popup = document.getElementById('popup');
            const editPopup = document.getElementById('editPopup');
            const paymentPopup = document.getElementById('popup_t');

            if (popup.classList.contains('active') || editPopup.classList.contains('active') || paymentPopup.classList.contains('active')) {
                popup.classList.remove('active');
                popup.style.display = 'none';
                editPopup.classList.remove('active');
                editPopup.style.display = 'none';
                paymentPopup.classList.remove('active');
                paymentPopup.style.display = 'none';
                overlay.classList.remove('active');
                document.getElementById('pay_to_popup_over').classList.remove('active');
            } else {
                sidebar.classList.toggle('active');
                overlay.classList.toggle('active');
            }
        }

        function togglePopup() {
            const popup = document.getElementById('popup');
            const overlay = document.getElementById('overlay');
            const sidebar = document.getElementById('sidebar');
            const editPopup = document.getElementById('editPopup');
            const paymentPopup = document.getElementById('popup_t');

            if (sidebar.classList.contains('active') || editPopup.classList.contains('active') || paymentPopup.classList.contains('active')) {
                sidebar.classList.remove('active');
                editPopup.classList.remove('active');
                editPopup.style.display = 'none';
                paymentPopup.classList.remove('active');
                paymentPopup.style.display = 'none';
                overlay.classList.remove('active');
                document.getElementById('pay_to_popup_over').classList.remove('active');
            } else {
                popup.classList.toggle('active');
                popup.style.display = popup.classList.contains('active') ? 'block' : 'none';
                overlay.classList.toggle('active');
            }
        }

        function toggleEditPopup() {
            const editPopup = document.getElementById('editPopup');
            const overlay = document.getElementById('overlay');
            const sidebar = document.getElementById('sidebar');
            const popup = document.getElementById('popup');
            const paymentPopup = document.getElementById('popup_t');

            if (sidebar.classList.contains('active') || popup.classList.contains('active') || paymentPopup.classList.contains('active')) {
                sidebar.classList.remove('active');
                popup.classList.remove('active');
                popup.style.display = 'none';
                paymentPopup.classList.remove('active');
                paymentPopup.style.display = 'none';
                overlay.classList.remove('active');
                document.getElementById('pay_to_popup_over').classList.remove('active');
            } else {
                editPopup.classList.toggle('active');
                editPopup.style.display = editPopup.classList.contains('active') ? 'block' : 'none';
                overlay.classList.toggle('active');
            }
        }

        function togglePaymentPopup() {
            const paymentPopup = document.getElementById('popup_t');
            const overlay = document.getElementById('pay_to_popup_over');
            const sidebar = document.getElementById('sidebar');
            const popup = document.getElementById('popup');
            const editPopup = document.getElementById('editPopup');

            if (sidebar.classList.contains('active') || popup.classList.contains('active') || editPopup.classList.contains('active')) {
                sidebar.classList.remove('active');
                popup.classList.remove('active');
                popup.style.display = 'none';
                editPopup.classList.remove('active');
                editPopup.style.display = 'none';
                overlay.classList.remove('active');
            } else {
                paymentPopup.classList.toggle('active');
                paymentPopup.style.display = paymentPopup.classList.contains('active') ? 'block' : 'none';
                overlay.classList.toggle('active');
            }
        }

        function saveOrderWithCustomer() {
            const customerName = document.getElementById('customerName').value.trim();
            if (orderList.length === 0) {
                alert('No order to save!');
                return;
            }
            if (!customerName) {
                alert('Please enter a customer name!');
                return;
            }

            let savedOrders = JSON.parse(localStorage.getItem('savedOrders')) || [];

            const newOrder = {
                id: Date.now(),
                customerName: customerName,
                orderList: [...orderList],
                totalAmount: orderList.reduce((sum, item) => sum + (item.price * item.quantity), 0),
                date: new Date().toLocaleString()
            };

            savedOrders.push(newOrder);
            localStorage.setItem('savedOrders', JSON.stringify(savedOrders));

            alert('Order saved successfully for ' + customerName + '!');
            document.getElementById('customerName').value = '';
            togglePaymentPopup();
            clearOrder();
        }

        function previewImage(input) {
            const preview = document.getElementById('imagePreviewPopup');
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            if (file) {
                reader.readAsDataURL(file);
            }
        }

        function addNewProduct() {
            const nameInput = document.getElementById('newProductNamePopup');
            const priceInput = document.getElementById('newProductPricePopup');
            const preview = document.getElementById('imagePreviewPopup');

            const name = nameInput.value.trim();
            const price = parseFloat(priceInput.value);
            const imgSrc = preview.src;

            if (name && !isNaN(price) && imgSrc && imgSrc !== window.location.href) {
                const newProduct = {
                    name: name,
                    price: price,
                    image: imgSrc
                };

                productsList.push(newProduct);
                saveProductsToStorage();
                renderProducts();
                renderFavorites();

                nameInput.value = '';
                priceInput.value = '';
                preview.src = '';
                preview.style.display = 'none';
                togglePopup();
            } else {
                alert('Please fill all fields and select an image!');
            }
        }

        function saveProductsToStorage() {
            localStorage.setItem('productsList', JSON.stringify(productsList));
        }

        function saveFavoritesToStorage() {
            localStorage.setItem('favoritesList', JSON.stringify(favoritesList));
        }

        function loadProductsFromStorage() {
            const storedProducts = localStorage.getItem('productsList');
            if (storedProducts) {
                productsList = JSON.parse(storedProducts);
            }
        }

        function loadFavoritesFromStorage() {
            const storedFavorites = localStorage.getItem('favoritesList');
            if (storedFavorites) {
                favoritesList = JSON.parse(storedFavorites);
            }
        }

        function toggleFavorite(name) {
            const index = favoritesList.indexOf(name);
            if (index === -1) {
                favoritesList.push(name);
            } else {
                favoritesList.splice(index, 1);
            }
            saveFavoritesToStorage();
            renderProducts();
            renderFavorites();
        }

        function renderProducts() {
            const productGrid = document.getElementById('productGrid');
            if (!productGrid) return;

            productGrid.innerHTML = '';

            productsList.forEach(product => {
                const isFavorited = favoritesList.includes(product.name);
                const productDiv = document.createElement('div');
                productDiv.classList.add('col-6', 'col-md-4', 'col-lg-3');
                productDiv.innerHTML = `
                    <div class="product-card" onclick="addToOrder('${product.name}', ${product.price})">
                        <img src="${product.image}" alt="${product.name}">
                        <span class="favorite-icon ${isFavorited ? 'favorited' : ''}" onclick="event.stopPropagation(); toggleFavorite('${product.name}')">★</span>
                        <div class="mt-2">${product.name}<br><strong>₹${product.price}</strong></div>
                    </div>
                `;
                productGrid.appendChild(productDiv);
            });
        }

        function renderFavorites() {
            const favoritesGrid = document.getElementById('favoritesGrid');
            if (!favoritesGrid) return;

            favoritesGrid.innerHTML = '';

            const favoriteProducts = productsList.filter(product => favoritesList.includes(product.name));

            if (favoriteProducts.length === 0) {
                favoritesGrid.innerHTML = '<p>No favorite products.</p>';
                return;
            }

            favoriteProducts.forEach(product => {
                const productDiv = document.createElement('div');
                productDiv.classList.add('col-6', 'col-md-4', 'col-lg-3');
                productDiv.innerHTML = `
                    <div class="product-card" onclick="addToOrder('${product.name}', ${product.price})">
                        <img src="${product.image}" alt="${product.name}">
                        <span class="favorite-icon favorited" onclick="event.stopPropagation(); toggleFavorite('${product.name}')">★</span>
                        <div class="mt-2">${product.name}<br><strong>₹${product.price}</strong></div>
                    </div>
                `;
                favoritesGrid.appendChild(productDiv);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadProductsFromStorage();
            loadFavoritesFromStorage();
            renderProducts();
            renderFavorites();
            updateOrderCount();
        });
    </script>
