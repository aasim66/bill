<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background: #ffffff; color: #333;
        }
        .login-container {
            background-color: #ffffff; padding: 2rem; border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2); width: 100%; max-width: 400px;
            transition: transform 0.3s ease;
        }
        .login-container:hover { transform: translateY(-5px); }
        .login-container h2 {
            text-align: center; margin-bottom: 1.5rem; color: #2c3e50;
            font-size: 1.8rem; font-weight: 600;
        }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label {
            display: block; margin-bottom: 0.5rem; font-size: 0.95rem;
            color: #34495e; font-weight: 500;
        }
        .form-group input {
            width: 100%; padding: 0.75rem; border: 1px solid #dfe6e9;
            border-radius: 6px; font-size: 1rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .form-group input:focus {
            outline: none; border-color: #0bbbbb;
            box-shadow: 0 0 0 3px rgba(110, 142, 251, 0.2);
        }
        .form-group input[type="submit"] {
            background-color: #0bbbbb; color: #ffffff; border: none;
            padding: 0.85rem; cursor: pointer; font-size: 1rem;
            font-weight: 500; border-radius: 6px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .form-group input[type="submit"]:hover {
            background-color: #0dc4c4; transform: translateY(-2px);
        }
        .error {
            color: #e74c3c; text-align: center; margin-bottom: 1rem;
            font-size: 0.9rem; background-color: #ffe6e6; padding: 0.5rem;
            border-radius: 4px; display: none;
        }
        .remember-me {
            display: flex; align-items: center; margin-bottom: 1.2rem;
        }
        .remember-me input { margin-right: 0.5rem; accent-color: #0bbbbb; }
        @media (max-width: 480px) {
            .login-container { padding: 1.5rem; margin: 1rem; }
            .login-container h2 { font-size: 1.5rem; }
            .form-group input { padding: 0.65rem; }
            .form-group input[type="submit"] { padding: 0.75rem; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2 onclick="window.location.href='rigister.html'";>Login</h2>
        <p class="error" id="error-message">Invalid username or password</p>
        <form id="login-form" method="post" action="">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <!-- <div class="remember-me">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Remember Me</label>
            </div> -->
            <div class="form-group">
                <input type="submit" value="Login">
            </div>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent form submission

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');

            // 🔒 Date lock
            const today = new Date();
            const lockDate = new Date("2025-08-30"); // expiry date (YYYY-MM-DD)

            if (today > lockDate) {
                errorMessage.textContent = "Login locked! Please contact admin.";
                errorMessage.style.display = 'block';
                return;
            }

            // ✅ Check user from localStorage
            const storedUser = localStorage.getItem("user_" + username);

            if (storedUser) {
                const userData = JSON.parse(storedUser);
                if (userData.password === password) {
                    errorMessage.style.display = 'none';
                    alert("Login successful! Welcome " + userData.fullname);
                    console.log("User logged in:", userData.fullname);

                    window.location.href = "billing.html"; // Redirect to main page
                    
                    // Example: redirect to dashboard.html
                    // window.location.href = "dashboard.html";
                } else {
                    errorMessage.textContent = "Invalid password";
                    errorMessage.style.display = 'block';
                }
            } else {
                errorMessage.textContent = "User not found. Please register first.";
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
